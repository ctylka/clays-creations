<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>
    <!-- Connecting the CSS file below -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">Coding with Clay</div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
        </ul>
    </nav>

    <header class="hero-section">
        <h1>Clay's Creations!</h1>
        <p>Welcome to my website showcasing coding projects and hobby items.</p>
        <button class="cta-btn">Get Started</button>
    </header>
    <section class="portfolio">
    <!-- Filter Buttons -->
    <div class="filter-buttons">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="web">Web Dev</button>
        <button class="filter-btn" data-category="design">Design</button>
    </div>

    <!-- Project Cards -->
    <div class="project-grid">
        <div class="project-card" data-item="web">Project 1 (Web)</div>
        <div class="project-card" data-item="design">Project 2 (Design)</div>
        <div class="project-card" data-item="web">Project 3 (Web)</div>
    </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
